[package]
name = "mrpemu-core"
description = "Platform-independent Sky-mobi mythroad (MRP) emulator core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
armv4t_emu.workspace = true
unifont.workspace = true
rustysynth-ext = { version = "1.5.0", features = ["sf3"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
amr-nb = "0.2.2"

[dev-dependencies]
env_logger.workspace = true
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy"] }
