[workspace]
resolver = "2"
members = [
    "crates/mrpemu-core",
    "crates/mrpemu",
    "crates/mrpemu-libretro",
]
exclude = ["vendor/armv4t_emu"]
# The libretro buildbot runs a bare `cargo build --release --target <triple>` at
# the repo root. Restrict the default build set to the libretro core so the CI
# does not try to cross-compile the standalone GUI binary (minifb, which needs
# X11/ALSA). Explicit `-p` / `--workspace` selections are unaffected.
default-members = ["crates/mrpemu-libretro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A Sky-mobi mythroad (MRP) feature-phone application emulator written in Rust"
license = "GPL-3.0-or-later"

[workspace.dependencies]
mrpemu-core = { path = "crates/mrpemu-core" }
anyhow = "1"              # Error handling at the frontend boundaries
thiserror = "2"           # Error handling (custom error enums in the core)
log = "0.4"               # Logging facade
encoding_rs = "0.8"       # GBK text decoding for MRP string fields
flate2 = "1"              # gzip member decompression inside .mrp packages
armv4t_emu = { path = "vendor/armv4t_emu" } # Vendored ARMv4T interpreter (Thumb ADD/CMP-to-PC fix)
unifont = "1.1"           # Embedded Unicode bitmap font (GBK/CJK glyph rendering)
clap = { version = "4", features = ["derive"] }  # CLI argument parsing (standalone)
minifb = "0.29"           # Window creation and pixel rendering (standalone)
env_logger = "0.11"       # Log output to stderr (standalone)
cpal = "0.18"             # Pure-Rust audio output (standalone)
image = { version = "0.25", default-features = false, features = ["png"] } # Screenshot encoding (standalone)

[profile.release]
opt-level = 3
lto = true
strip = true

# EmulatorJS static library build. panic=abort keeps wasm exception handling
# out of the module because Binaryen's Asyncify pass rejects EH instructions.
[profile.wasm-release]
inherits = "release"
panic = "abort"
